name: ci

on:
  push:
    branches: ['master']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 所有分支/tag 都会跑：格式、静态检查、单元测试、本机架构冒烟
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # 与本机验证过的大版本对齐；升级 Go 时同步改这里
          go-version: '1.27'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: 构建并冒烟运行（amd64）
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=ci" -o gwt .
          ./gwt --version
          ./gwt --json . | head -5

  # 只有打 tag 才构建多架构产物
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: ['amd64', 'arm64', '386', 'riscv64']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: 构建 gwt-linux-${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # 与 AUR PKGBUILD 用完全相同的参数，保证两边产物行为一致
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=$version" \
            -o "gwt-linux-${{ matrix.goarch }}" .
      - name: 本机架构上冒烟（其它架构无法在本 runner 执行）
        if: matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          ./gwt-linux-amd64 --version
          # 刻意不用 --strict：actions/checkout 留下的是 detached HEAD 且没有 upstream，
          # 那本来就属于「需要关注」的状态，--strict 会（正确地）返回 1。
          # 这里改为直接校验 JSON 契约本身，不依赖 runner 上仓库的干净程度。
          ./gwt-linux-amd64 --json . > /tmp/gwt.json
          python3 -c 'import json; d=json.load(open("/tmp/gwt.json")); assert d["schema"]==1 and d["tool"]=="gwt"; assert d["read_only"] is True and d["fetched"] is False; assert d["summary"]["worktrees"]>=1; print("JSON 契约 OK:", d["summary"])'
          # 表格路径也要跑通；重定向到文件后再取前几行，避免 pipefail 下 SIGPIPE 误判
          ./gwt-linux-amd64 --color never --width 100 . > /tmp/gwt.txt
          head -3 /tmp/gwt.txt
      - uses: actions/upload-artifact@v7
        with:
          name: gwt-linux-${{ matrix.goarch }}
          path: gwt-linux-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum gwt-linux-* > SHA256SUMS
          cat SHA256SUMS
      - name: 创建 Release 并上传产物（直接走 REST API，不依赖 gh CLI 与本地 git 仓库）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          tag="$GITHUB_REF_NAME"

          # 1) 幂等：同名 release 若已存在，先删掉（只删 release，不动 tag）
          curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$api/releases/tags/$tag" >/dev/null || true

          # 2) 构造创建 release 的 payload（用 python 生成，避免 shell 拼 JSON）
          TAG="$tag" REPO="$GITHUB_REPOSITORY" python3 -c 'import json,os; json.dump({"tag_name": os.environ["TAG"], "name": os.environ["TAG"], "body": "gwt static Linux binaries (no interpreter, no libc dependency).\n\nInstall:\n\n    curl -fsSL https://raw.githubusercontent.com/%s/master/install.sh | sh\n" % os.environ["REPO"]}, open("/tmp/payload.json", "w"))'

          # 注意：-d 默认发 application/x-www-form-urlencoded，而 REST API 要 application/json
          code=$(curl -sS -o /tmp/rel.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "$api/releases" --data-binary @/tmp/payload.json)
          if [ "$code" != "201" ]; then
            echo "创建 Release 失败（HTTP $code）："; cat /tmp/rel.json; exit 1
          fi
          echo "Release $tag 已创建"

          # 3) 逐个上传资产：upload_url 末尾的 {?name,label} 要去掉
          upload=$(python3 -c 'import json; print(json.load(open("/tmp/rel.json"))["upload_url"].split("{")[0])')
          for f in dist/*; do
            name=$(basename "$f")
            code=$(curl -sS -o /tmp/up.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" "$upload?name=$name")
            if [ "$code" != "201" ]; then
              echo "上传 $name 失败（HTTP $code）："; cat /tmp/up.json; exit 1
            fi
            echo "已上传 $name"
          done

          # 4) 回读确认
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$api/releases/tags/$tag" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Release", d["tag_name"], "资产:"); [print("  -", a["name"], a["size"], "bytes") for a in d["assets"]]'
